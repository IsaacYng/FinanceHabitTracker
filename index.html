:root{
  --bg:#F6F7F8;
  --surface:#FFFFFF;
  --surface2:#EEF3F0;
  --ink:#0E1F1A;
  --muted:#64748B;
  --line:#E2E8F0;
  --green:#0B3D2E;
  --green2:#14704F;
  --green-soft:#E6F2ED;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --orange:#D97706;
  --orange-soft:#FFFBEB;
  --gold:#C9A227;
  --gold-soft:#FDF6DE;
}

[data-theme="light"]{
  --bg:#F6F7F8;
  --surface:#FFFFFF;
  --surface2:#EEF3F0;
  --ink:#0E1F1A;
  --muted:#64748B;
  --line:#E2E8F0;
  --green:#0B3D2E;
  --green2:#14704F;
  --green-soft:#E6F2ED;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --orange:#D97706;
  --orange-soft:#FFFBEB;
  --gold:#C9A227;
  --gold-soft:#FDF6DE;
}

[data-theme="dark"]{
  --bg:#0B1210;
  --surface:#14201C;
  --surface2:#1C2B25;
  --ink:#F1F5F4;
  --muted:#94A3B8;
  --line:#24352F;
  --green:#2FBF86;
  --green2:#3ED19A;
  --green-soft:#1D3A2E;
  --red:#FB7185;
  --red-soft:#3A2226;
  --orange:#FBBF24;
  --orange-soft:#3A2E1A;
  --gold:#E9C46A;
  --gold-soft:#3A3218;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1210;
    --surface:#14201C;
    --surface2:#1C2B25;
    --ink:#F1F5F4;
    --muted:#94A3B8;
    --line:#24352F;
    --green:#2FBF86;
    --green2:#3ED19A;
    --green-soft:#1D3A2E;
    --red:#FB7185;
    --red-soft:#3A2226;

    --orange-soft:#3A2E1A;
    --gold:#E9C46A;

  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif
}

h1,h2,h3,.display{
  font-family:'Sora','Manrope',system-ui,sans-serif
}

button,input,select,textarea{
  font-family:inherit
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--green)!important;
  box-shadow:0 0 0 3px rgba(11,61,46,.12)
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#CBD5E1;
  border-radius:99px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(14px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(12px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes drawerIn{
  from{
    opacity:0;
    transform:translateX(-100%)
  }

  to{
    opacity:1;
    transform:translateX(0)
  }
}

.animate-drawerIn{
  animation:drawerIn .32s cubic-bezier(.2,.9,.3,1) both
}

@keyframes shimmer{
  0%{
    background-position:-400px 0
  }

  100%{
    background-position:400px 0
  }
}

.animate-fadeUp{
  animation:fadeUp .35s ease both
}

.animate-modal{
  animation:modalIn .28s cubic-bezier(.2,.9,.3,1.2) both
}

.animate-toast{
  animation:toastIn .25s ease both
}

.skeleton{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);
  background-size:800px 100%;
  animation:shimmer 1.4s infinite linear
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:.7
  }
}

.confetti-piece{
  animation:confettiFall 3.2s ease-in infinite
}

.last\:border-0:last-child{
  border-width: 0px;
}

.hover\:bg-\[var\(--surface2\)\]:hover{
  background-color: var(--surface2);
}

.hover\:text-\[var\(--green\)\]:hover{
  color: var(--green);
}

.hover\:text-\[var\(--red\)\]:hover{
  color: var(--red);
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

@media (min-width: 640px){
  .sm\:right-6{

  }

  .sm\:block{
    display: block;

  }

}

  }
