  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-md{
  --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 4px 6px -1px var(--tw-shadow-color), 0 2px 4px -2px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-sm{
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-xl{
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.ring-2{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.ring-\[var\(--gold\)\]{
  --tw-ring-color: var(--gold);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;
}

:root{
  --bg:#F6F7F8;
  --surface:#FFFFFF;
  --surface2:#EEF3F0;
  --ink:#0E1F1A;
  --muted:#64748B;
  --line:#E2E8F0;
  --green:#0B3D2E;
  --green2:#14704F;
  --green-soft:#E6F2ED;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --orange:#D97706;
  --orange-soft:#FFFBEB;
  --gold:#C9A227;
  --gold-soft:#FDF6DE;
}

[data-theme="light"]{
  --bg:#F6F7F8;
  --surface:#FFFFFF;
  --surface2:#EEF3F0;
  --ink:#0E1F1A;
  --muted:#64748B;
  --line:#E2E8F0;
  --green:#0B3D2E;
  --green2:#14704F;
  --green-soft:#E6F2ED;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --orange:#D97706;
  --orange-soft:#FFFBEB;
  --gold:#C9A227;
  --gold-soft:#FDF6DE;
}

[data-theme="dark"]{
  --bg:#0B1210;
  --surface:#14201C;
  --surface2:#1C2B25;
  --ink:#F1F5F4;
  --muted:#94A3B8;
  --line:#24352F;
  --green:#2FBF86;
  --green2:#3ED19A;
  --green-soft:#1D3A2E;
  --red:#FB7185;
  --red-soft:#3A2226;
  --orange:#FBBF24;
  --orange-soft:#3A2E1A;
  --gold:#E9C46A;
  --gold-soft:#3A3218;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1210;
    --surface:#14201C;
    --surface2:#1C2B25;
    --ink:#F1F5F4;
    --muted:#94A3B8;
    --line:#24352F;
    --green:#2FBF86;
    --green2:#3ED19A;
    --green-soft:#1D3A2E;
    --red:#FB7185;
    --red-soft:#3A2226;
    --orange:#FBBF24;
    --orange-soft:#3A2E1A;
    --gold:#E9C46A;
    --gold-soft:#3A3218;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif
}

h1,h2,h3,.display{
  font-family:'Sora','Manrope',system-ui,sans-serif
}

button,input,select,textarea{
  font-family:inherit
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--green)!important;
  box-shadow:0 0 0 3px rgba(11,61,46,.12)
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#CBD5E1;
  border-radius:99px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(14px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(12px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes drawerIn{
  from{
    opacity:0;
    transform:translateX(-100%)
  }

  to{
    opacity:1;
    transform:translateX(0)
  }
}

.animate-drawerIn{
  animation:drawerIn .32s cubic-bezier(.2,.9,.3,1) both
}

@keyframes shimmer{
  0%{
    background-position:-400px 0
  }

  100%{
    background-position:400px 0
  }
}

.animate-fadeUp{
  animation:fadeUp .35s ease both
}

.animate-modal{
  animation:modalIn .28s cubic-bezier(.2,.9,.3,1.2) both
}

.animate-toast{
  animation:toastIn .25s ease both
}

.skeleton{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);
  background-size:800px 100%;
  animation:shimmer 1.4s infinite linear
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:.7
  }
}

.confetti-piece{
  animation:confettiFall 3.2s ease-in infinite
}

.last\:border-0:last-child{
  border-width: 0px;
}

.hover\:bg-\[var\(--surface2\)\]:hover{
  background-color: var(--surface2);
}

.hover\:text-\[var\(--green\)\]:hover{
  color: var(--green);
}

.hover\:text-\[var\(--red\)\]:hover{
  color: var(--red);
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

@media (min-width: 640px){
  .sm\:right-6{
    right: 1.5rem;
  }

  .sm\:block{
    display: block;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:h-10{
    height: 2.5rem;
  }

  .sm\:w-10{
    width: 2.5rem;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-3{
    padding-left: 0.75rem;
    padding-right: 0.75rem;
  }

  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-\[11px\]{
    font-size: 11px;
  }

  .sm\:text-\[12px\]{
    font-size: 12px;
  }

  .sm\:text-\[17px\]{
    font-size: 17px;
  }

  .sm\:text-\[20px\]{
    font-size: 20px;
  }

  .sm\:text-\[24px\]{
    font-size: 24px;
  }

  .sm\:text-\[28px\]{
    font-size: 28px;
  }

  .sm\:text-\[42px\]{
    font-size: 42px;
  }
}

@media (min-width: 768px){
  .md\:inline-flex{
    display: inline-flex;
  }

  .md\:hidden{
    display: none;
  }
}

@media (min-width: 1024px){
  .lg\:bottom-5{
    bottom: 1.25rem;
  }

  .lg\:bottom-6{
    bottom: 1.5rem;
  }

  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }

  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-center{
    align-items: center;
  }

  .lg\:pb-8{
    padding-bottom: 2rem;
  }
}
