<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<title>Firebase Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
  #log { margin-top: 20px; white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; }
  .ok { color: green; }
  .err { color: red; }
</style>
</head>
<body>
  <h2>Firebase Firestore Test</h2>
  <p>Yo button click garnu — Firestore ma test data write garcha, ani feri read garera dekhaucha.</p>
  <button id="runBtn">Run Test</button>
  <div id="log">Result yaha dekhincha...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Same config as your firebase.js (hardcoded here just for this test page)
    const firebaseConfig = {
      apiKey: "AIzaSyB_ep2-cHy4xIA5yoxkC2jPfiDWG4bW7lU",
      authDomain: "project-jun-2f357.firebaseapp.com",
      projectId: "project-jun-2f357",
      storageBucket: "project-jun-2f357.firebasestorage.app",
      messagingSenderId: "276638637528",
      appId: "1:276638637528:web:62d034cfc13f8d6d51e6ad",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const log = document.getElementById("log");

    document.getElementById("runBtn").addEventListener("click", async () => {
      log.textContent = "Testing...";
      try {
        // 1. Write a test doc
        const docRef = await addDoc(collection(db, "test_collection"), {
          message: "Hello from test page",
          createdAt: serverTimestamp(),
        });
        log.innerHTML = `<span class="ok">✔ Write success. Doc ID: ${docRef.id}</span>\n`;

        // 2. Read it back
        const snapshot = await getDocs(collection(db, "test_collection"));
        let out = `\nTotal docs in "test_collection": ${snapshot.size}\n\n`;
        snapshot.forEach((d) => {
          out += `- ${d.id}: ${JSON.stringify(d.data())}\n`;
        });
        log.innerHTML += out;
      } catch (err) {
        log.innerHTML = `<span class="err">✘ Error: ${err.message}</span>\n\nCheck: 1) Firestore enabled in Firebase Console, 2) Security rules allow write/read.`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
